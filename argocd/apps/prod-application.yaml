apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-gateway-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/MohammedRihan25/gitops-argocd-helm-delivery.git
    targetRevision: HEAD
    path: charts/payment-gateway
    helm:
      valueFiles:
        - ../../environments/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: payment-prod
  syncPolicy:
    # Production utilizes manual sync approval gates or strict sync windows
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
