apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-gateway-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/MohammedRihan25/gitops-argocd-helm-delivery.git
    targetRevision: HEAD
    path: charts/payment-gateway
    helm:
      valueFiles:
        - ../../environments/staging/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: payment-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
