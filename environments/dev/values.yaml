environment: dev

replicaCount: 1

image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/payment-gateway
  tag: "1.0.0-dev"

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: payment-dev.company.internal
      paths:
        - path: /
          pathType: Prefix
